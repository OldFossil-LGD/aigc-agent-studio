[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-agent-studio"
version = "1.0.1b2"
description = "Public Beta of a LibTV-based filmmaking skill for AI agents"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
# 几个视频读取/切片工具用到；缺它也能安装并运行其余全部功能。
video = ["opencv-python>=4", "numpy>=1.24", "imageio-ffmpeg>=0.4"]
all = ["opencv-python>=4", "numpy>=1.24", "imageio-ffmpeg>=0.4"]

[tool.setuptools]
packages = ["scripts"]
